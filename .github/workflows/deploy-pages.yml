# Requires Pages to be enabled once: Repo → Settings → Pages → Source: GitHub Actions
# https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Stage static site files
        run: |
          mkdir -p _site
          cp index.html detail.html viewer.html styles.css detail.css cursor.js scene-scale.js sticky-notes.js sticky-theme.js patent-cube.js detail-nav.js detail.js gltf-viewer.js viewer-entry.js patent-gltf-embed.js live-reload.js _site/
          cp -r assets _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
